name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - ygr-react-static-web-app
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - ygr-react-static-web-app

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # match your project node version

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "a60ef4ecac93b41a7f6fcf8ef5601b97e31952ff9617cece802481919077fb7302-34adace8-0fbe-42c3-8d89-b60629120a8b0030532016828203"
          action: "upload"
          app_location: "/"        # root of repo
          api_location: ""         # empty if no API
          output_location: "dist"  # folder with production build




