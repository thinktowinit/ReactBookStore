name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - ygr-react-static-web-app
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - ygr-react-static-web-app

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # 1️⃣ Checkout your repository
      - uses: actions/checkout@v3

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # match your project Node version

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build your React app
      - name: Build React app
        run: npm run build

      # 5️⃣ Deploy to Azure Static Web App
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}  # must be set in GitHub secrets
          repo_token: ${{ secrets.GITHUB_TOKEN }}  # automatically provided by GitHub
          action: "upload"
          app_location: "/"        # root folder of your repo
          api_location: ""         # leave empty if no API
          output_location: "dist"  # production build folder (Vite outputs here)
          skip_deploy_on_missing_secrets: true
          
